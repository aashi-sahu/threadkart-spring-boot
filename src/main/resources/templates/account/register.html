<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="auth-box">
        <h1 class="h3">Create an account</h1>
        <p class="text-muted">Takes less than a minute.</p>

        <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label for="firstName" class="form-label">First name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="lastName" class="form-label">Last name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control">
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-dark w-100 mt-4">Sign up</button>
        </form>
        <p class="small mt-3 mb-0">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order ' + ${order.orderNumber})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:if="${justPlaced}" class="order-placed">
        <i class="bi bi-check-circle"></i>
        <div>
            <h1 class="h4 mb-1">Thanks! Your order is placed.</h1>
            <p class="mb-0 text-muted">Keep the order number handy: <strong th:text="${order.orderNumber}">TK-0000</strong></p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <a th:href="@{/orders}" class="small">&larr; All orders</a>
            <h2 class="h4 mb-0 mt-1">Order <span th:text="${order.orderNumber}">TK-0000</span></h2>
            <small class="text-muted" th:text="'Placed on ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy, hh:mm a')}">date</small>
        </div>
        <span class="status fs-6" th:classappend="'status-' + ${#strings.toLowerCase(order.status)}" th:text="${order.status}">PLACED</span>
    </div>

    <div th:replace="~{fragments/order :: orderBody}"></div>

    <form th:if="${order.status.name() == 'PLACED'}" th:action="@{/orders/{n}/cancel(n=${order.orderNumber})}" method="post"
          class="mt-3" onsubmit="return confirm('Cancel this order?')">
        <button type="submit" class="btn btn-outline-danger btn-sm">Cancel order</button>
    </form>
</main>


<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

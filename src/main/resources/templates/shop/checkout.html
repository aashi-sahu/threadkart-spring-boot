<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-3">Checkout</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/checkout}" th:object="${form}" method="post" novalidate>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="panel">
                    <h2 class="h6 mb-3">Delivery address</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fullName" class="form-label">Full name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Mobile number</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control" maxlength="10" inputmode="numeric" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-12">
                            <label for="addressLine1" class="form-label">House no, street</label>
                            <input type="text" id="addressLine1" th:field="*{addressLine1}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{addressLine1}"></div>
                        </div>
                        <div class="col-12">
                            <label for="addressLine2" class="form-label">Area, landmark <span class="text-muted">(optional)</span></label>
                            <input type="text" id="addressLine2" th:field="*{addressLine2}" class="form-control">
                        </div>
                        <div class="col-md-5">
                            <label for="city" class="form-label">City</label>
                            <input type="text" id="city" th:field="*{city}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{city}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="state" class="form-label">State</label>
                            <input type="text" id="state" th:field="*{state}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{state}"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="pincode" class="form-label">Pincode</label>
                            <input type="text" id="pincode" th:field="*{pincode}" class="form-control" maxlength="6" inputmode="numeric" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{pincode}"></div>
                        </div>
                    </div>
                </div>
                <div class="panel mt-3">
                    <h2 class="h6 mb-2">Payment</h2>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="cod" checked disabled>
                        <label class="form-check-label" for="cod">Cash on Delivery</label>
                    </div>
                    <small class="text-muted">Online payments aren't enabled in this demo.</small>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="panel">
                    <h2 class="h6 mb-3">Your order</h2>
                    <div class="d-flex justify-content-between small mb-2" th:each="item : ${cart.items}">
                        <span>
                            <span th:text="${item.product.name}">Name</span>
                            <span class="text-muted" th:text="${item.size != null} ? '(' + ${item.size} + ')' : ''"></span>
                            &times; <span th:text="${item.quantity}">1</span>
                        </span>
                        <span th:text="'₹' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 0, 'POINT')}">₹499</span>
                    </div>
                    <hr>
                    <div th:replace="~{fragments/order :: summary}"></div>
                    <button type="submit" class="btn btn-dark w-100 mt-3">Place order</button>
                </div>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<nav th:replace="~{fragments/layout :: adminNav('products')}"></nav>

<main class="container py-4">
    <a th:href="@{/admin/products}" class="small">&larr; Back to products</a>
    <h1 class="h4 mt-2 mb-3" th:text="${productDTO.id == null} ? 'New product' : 'Edit product'">New product</h1>

    <div class="alert alert-warning" th:if="${categories.isEmpty()}">
        Add a <a th:href="@{/admin/categories/add}">category</a> first, every product needs one.
    </div>

    <form th:action="@{/admin/products/add}" method="post" th:object="${productDTO}" enctype="multipart/form-data">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{imageId}">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="panel">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" th:field="*{name}" id="name" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="categoryId" class="form-label">Category</label>
                        <select class="form-select" th:field="*{categoryId}" id="categoryId" th:errorclass="is-invalid">
                            <option value="">Choose...</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="price" class="form-label">Price (₹)</label>
                            <input type="number" step="0.01" min="1" class="form-control" th:field="*{price}" id="price" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" min="0" class="form-control" th:field="*{stock}" id="stock" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{stock}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="sizes" class="form-label">Sizes</label>
                        <input type="text" class="form-control" th:field="*{sizes}" id="sizes" placeholder="S,M,L,XL">
                        <div class="form-text">Comma separated. Leave empty for free-size items.</div>
                    </div>
                    <div>
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" rows="4" th:field="*{description}" id="description" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="panel">
                    <label for="productImage" class="form-label">Photo</label>
                    <input type="file" class="form-control" name="productImage" id="productImage" accept="image/jpeg,image/png,image/webp">
                    <div class="form-text">JPG, PNG or WEBP, max 2 MB. Leave empty to keep the current photo.</div>
                    <img id="imgPreview" class="img-preview mt-3" alt=""
                         th:src="${productDTO.imageId != null} ? @{/product-images/{id}(id=${productDTO.imageId})} : ''"
                         th:classappend="${productDTO.imageId == null} ? 'd-none'">
                </div>
                <button type="submit" class="btn btn-dark w-100 mt-3">Save product</button>
            </div>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // show the chosen photo before uploading
    document.getElementById('productImage').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        const img = document.getElementById('imgPreview');
        img.src = URL.createObjectURL(file);
        img.classList.remove('d-none');
    });
</script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<nav th:replace="~{fragments/layout :: adminNav('orders')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Orders</h1>
        <div class="btn-group btn-group-sm flex-wrap">
            <a th:href="@{/admin/orders}" class="btn btn-outline-dark" th:classappend="${selectedStatus == null} ? 'active'">All</a>
            <a th:each="s : ${statuses}" th:href="@{/admin/orders(status=${s})}" class="btn btn-outline-dark"
               th:classappend="${selectedStatus == s} ? 'active'" th:text="${s}">PLACED</a>
        </div>
    </div>

    <div class="panel p-0 table-responsive">
        <table class="table mb-0 align-middle">
            <thead>
            <tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:if="${orders.isEmpty()}"><td colspan="6" class="text-muted">No orders here.</td></tr>
            <tr th:each="o : ${orders}">
                <td><a th:href="@{/admin/orders/{n}(n=${o.orderNumber})}" th:text="${o.orderNumber}">TK</a></td>
                <td>
                    <div th:text="${o.fullName}">name</div>
                    <small class="text-muted" th:text="${o.user.email}">email</small>
                </td>
                <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy')}">date</td>
                <td th:text="${o.itemCount}">1</td>
                <td th:text="'₹' + ${#numbers.formatDecimal(o.total, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                <td><span class="status" th:classappend="'status-' + ${#strings.toLowerCase(o.status)}" th:text="${o.status}">PLACED</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Shared bits used by every page: <head>, navbar, flash messages, footer, product card -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ThreadKart'">ThreadKart</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg site-nav">
    <div class="container">
        <a class="navbar-brand brand" th:href="@{/}">Thread<span>Kart</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <form class="nav-search ms-lg-4 my-3 my-lg-0" th:action="@{/shop}" method="get" role="search">
                <i class="bi bi-search"></i>
                <input class="form-control" type="search" name="q" placeholder="Search tees, jeans, hoodies..."
                       th:value="${q}" aria-label="Search">
            </form>

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person"></i> Account
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text small text-muted" sec:authentication="name">me@example.com</span></li>
                        <li><a class="dropdown-item" th:href="@{/orders}">My orders</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Log out</button>
                            </form>
                        </li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link cart-link" th:href="@{/cart}" aria-label="Cart">
                        <i class="bi bi-bag"></i>
                        <span class="cart-badge" th:if="${cartCount != null and cartCount gt 0}" th:text="${cartCount}">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<nav th:fragment="adminNav(active)" class="admin-tabs">
    <div class="container d-flex gap-1 overflow-auto">
        <a th:href="@{/admin}" th:classappend="${active == 'home'} ? 'active'">Dashboard</a>
        <a th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'active'">Orders</a>
        <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'active'">Products</a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active'">Categories</a>
    </div>
</nav>

<div th:fragment="flash">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div th:fragment="productCard(p)" class="product-card">
    <a th:href="@{/shop/product/{id}(id=${p.id})}" class="product-thumb">
        <img th:if="${p.imageId != null}" th:src="@{/product-images/{id}(id=${p.imageId})}" th:alt="${p.name}" loading="lazy">
        <span th:if="${p.imageId == null}" class="no-image"><i class="bi bi-image"></i></span>
        <span class="tag tag-out" th:if="${!p.inStock}">Sold out</span>
        <span class="tag" th:if="${p.inStock and p.stock lt 5}" th:text="'Only ' + ${p.stock} + ' left'">Only 3 left</span>
    </a>
    <div class="product-info">
        <small class="text-muted" th:text="${p.category.name}">Category</small>
        <a th:href="@{/shop/product/{id}(id=${p.id})}" class="product-name" th:text="${p.name}">Product name</a>
        <div class="price" th:text="'₹' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}">₹499</div>
    </div>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span><strong class="brand small">Thread<span>Kart</span></strong> &middot; a Spring Boot practice project</span>
        <span class="text-muted">Payments are Cash on Delivery only &middot; no real orders are shipped</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

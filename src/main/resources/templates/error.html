<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5 text-center">
    <p class="display-4 brand mb-0" th:text="${status}">500</p>
    <h1 class="h4">Something went wrong on our side</h1>
    <p class="text-muted">Try again in a moment. If it keeps happening, the logs will have the details.</p>
    <a th:href="@{/}" class="btn btn-dark">Go home</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

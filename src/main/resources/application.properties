spring.application.name=threadkart
server.port=${PORT:8086}

# Database - local MySQL by default, override with env vars when deploying
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/threadkart?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# product image uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# admin account created on first start (change these before deploying!)
app.admin.email=${ADMIN_EMAIL:admin@threadkart.in}
app.admin.password=${ADMIN_PASSWORD:admin123}
# fills the store with a few sample products when the product table is empty
app.seed-demo-data=${SEED_DEMO_DATA:true}

# shipping rules (in rupees)
app.shipping.free-above=999
app.shipping.charge=49

server.error.whitelabel.enabled=false
